name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      ref:
        required: false
      ref_name:
        required: false
      linux_os:
        description: |
          JSON array of Linux distros to build, for example ["el10"].
          Build a subset to add assets for a new distro to a release that
          already exists, without rebuilding the assets it already has.
          Empty builds every distro.
        required: false
        default: ""
      skip_mac:
        description: |
          Skip the macOS builds. Set this when the release already has its
          macOS assets.
        required: false
        type: boolean
        default: false

jobs:
  mac:
    if: ${{ !inputs.skip_mac }}
    strategy:
      fail-fast: false
      matrix:
        otp:
          - "27.3.4.2-5"
          - "28.2-2"
        rebar3:
          - "3.24.0"
        os:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: emqx/macos-erlang@f744c98139c0db83a10619587d4bae4fc49765a8 # v1.0.0
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: build
        run: env BUILD_RELEASE=1 make

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: erlang-rocksdb-nif-${{ matrix.os }}-${{ matrix.otp }}
          path: |
            _packages/*.gz
            _packages/*.gz.sha256

  linux:
    strategy:
      fail-fast: false
      matrix:
        erlang:
          - otp: "27.3.4.2-9"
            builder: "6.2-3:1.18.3-27.3.4.2-9"
          - otp: "28.5.0.7-3"
            builder: "6.2-3:1.19.1-28.5.0.7-3"
        arch:
          - amd64
          - arm64
        # The prebuilt file name carries the OTP major only, so one asset per
        # (version, OTP major, distro, arch) serves every OTP patch release.
        os: >-
          ${{ fromJSON(github.event.inputs.linux_os || '["ubuntu24.04",
          "ubuntu22.04", "debian13", "debian12", "debian11", "el10", "el9",
          "el8", "el7", "amzn2023", "alpine3.15.1"]') }}

    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}

    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive
        # NOTE: build in container does not work because older platforms like
        #       el7 and amzn2 do not support nodejs 20 runtime which is required
        #       for github actions
      - name: build
        env:
          IMAGE: ghcr.io/emqx/emqx-builder/${{ matrix.erlang.builder }}-${{ matrix.os }}
        run: >-
          docker run --rm -v ${PWD}:/wd ${IMAGE} bash -euc "
          git config --global --add safe.directory '*';
          make -C /wd BUILD_RELEASE=1
          "

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: erlang-rocksdb-nif-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.erlang.otp }}
          path: |
            _packages/*.gz
            _packages/*.gz.sha256

  release:
    runs-on: ubuntu-latest
    # always(), because the mac job is skipped when skip_mac is set, and a
    # skipped dependency skips this job unless the condition states otherwise.
    if: >-
      always()
      && needs.linux.result == 'success'
      && needs.mac.result != 'failure'
      && needs.mac.result != 'cancelled'
      && (github.event.inputs.ref_name || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    needs:
      - mac
      - linux
    steps:
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          pattern: erlang-rocksdb-nif-*
          path: packages
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87 # v2.0.5
        with:
          name: Erlang Rocksdb NIF ${{ github.event.inputs.ref_name || github.ref_name }} Released
          tag_name: ${{ github.event.inputs.ref_name || github.ref_name }}
          files: packages/*
          draft: false
          prerelease: false
